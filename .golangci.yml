version: "2"
run:
  timeout: 5m
  go: "1.27"
  build-tags:
    - goexperiment.arenas
    - goexperiment.goroutineleakprofile
    - goexperiment.runtimesecret
    - goexperiment.simd
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
output:
  formats: {}
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - ireturn
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint
  disable:
    - depguard
    - noinlineerr
    - paralleltest
  settings:
    cyclop:
      max-complexity: 25
    errcheck:
      exclude-functions:
        - (*os.File).Close
        - (io.Closer).Close
        - (*sql.DB).Close
        - (*sql.Rows).Close
        - (*sql.Stmt).Close
        - (net.Conn).Close
        - (*net.TCPConn).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Print
        - fmt.Printf
        - fmt.Println
        - (*strings.Builder).WriteString
        - (*bytes.Buffer).WriteString
    funlen:
      lines: 120
      statements: 80
    ginkgolinter:
      forbid-focus-container: true
      forbid-spec-pollution: true
    gocognit:
      min-complexity: 35
    goconst:
      ignore-tests: true
      min-len: 4
      min-occurrences: 5
    gocritic:
      disabled-checks:
        - ifElseChain
    gocyclo:
      min-complexity: 25
    godot:
      scope: toplevel
    gomoddirectives:
      replace-local: true
    gosec:
      excludes:
        - G102
        - G104
        - G301
        - G302
        - G304
        - G306
        - G307
        - G404
    ireturn:
      allow:
        - error
        - empty
        - anon
        - stdlib
        - generic
    makezero:
      always: true
    mnd:
      ignored-functions:
        - fmt.Errorf
        - fmt.Fprintf
        - fmt.Sprintf
        - time.ParseDuration
    nestif:
      min-complexity: 6
    revive:
      rules:
        - disabled: true
          name: package-comments
    tagalign:
      align: false
      order:
        - binding
        - json
        - yaml
        - xml
        - toml
        - validate
        - mapstructure
      sort: true
    tagliatelle:
      case:
        rules:
          json: camel
    testifylint:
      disable:
        - go-require
      enable-all: true
    varnamelen:
      ignore-decls:
        - err error
        - wg sync.WaitGroup
        - mu sync.Mutex
        - c context.Context
        - r *http.Request
        - w http.ResponseWriter
        - t *testing.T
        - b *testing.B
        - f *testing.F
        - db *sql.DB
        - tx *sql.Tx
        - ok bool
        - id string
        - n int
        - fn func()
        - i int
        - j int
      ignore-map-index-ok: true
      ignore-names:
        - err
        - ok
        - tt
        - fn
        - t
        - i
        - m
        - g
        - a
        - b
        - v
      ignore-type-assert-ok: true
      max-distance: 15
      min-name-length: 2
    wrapcheck:
      extra-ignore-sigs:
        - fmt.Fprintln(
      ignore-package-globs:
        - github.com/larsartmann/go-compliance
        - github.com/larsartmann/go-compliance/hub
        - github.com/larsartmann/go-compliance/hub/*
        - github.com/larsartmann/cmdguard
        - github.com/larsartmann/cmdguard/*
        - github.com/larsartmann/go-sse
        - github.com/larsartmann/go-sse/*
        - github.com/larsartmann/go-health
        - github.com/larsartmann/go-health/*
        - github.com/larsartmann/go-output
        - github.com/larsartmann/go-output/*
        - github.com/larsartmann/go-sqlitestore
        - github.com/larsartmann/go-sqlitestore/*
  exclusions:
    generated: lax
    rules:
      - path: ^v1\.go$
        text: json
        linters:
          - tagliatelle
      - path: ^examples/
        linters:
          - forbidigo
          - gosec
          - mnd
      - path: _test\.go
        linters:
          - err113
          - forcetypeassert
          - funlen
          - gochecknoglobals
          - goconst
          - gosec
          - mnd
          - wrapcheck
          - exhaustruct_v5
          - testpackage
          - cyclop
          - errcheck
          - ireturn
          - recvcheck
          - contextcheck
          - exhaustive
      - path: _test\.go
        text: unused
        linters:
          - unused
    paths:
      - \.gen\.go$
      - _templ\.go$
      - vendor/
formatters:
  enable:
    - goimports
    - gofumpt
    - golines
  settings:
    golines:
      max-len: 120
  exclusions:
    generated: lax
    paths:
      - _templ\.go$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
