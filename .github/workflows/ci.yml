# CI for the two-module workspace (core at root, hub/). Jobs mirror the
# local gates: per-module build+test with GOWORK=off (module isolation),
# golangci-lint pinned to the devShell version, dprint formatting,
# actionlint, stack-drift-check, docs-gates, and nix flake check.
#
# Hub jobs and flake-check need the FLAKE_PAT secret (fine-grained PAT,
# read-only Contents on LarsArtmann/go-daemon); they are skipped, not
# failed, while the secret is absent so the public mirror stays green.
# Valid on GitHub runners and Forgejo Actions (standard constructs only).
name: CI

on:
  push:
    branches: [master]
  pull_request:

# CI never publishes: contents stays read (cue-policy ci_workflow.cue).
permissions:
  contents: read

env:
  FLAKE_PAT: ${{ secrets.FLAKE_PAT }}

jobs:
  core:
    name: build+test (core)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: GOWORK=off go build ./...
      # -race parity with the local gate: core is dependency-light but the
      # branded types and fold are shared fleet contract code.
      - run: GOWORK=off go test -race -count=1 ./...

  hub:
    name: build+test (hub)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: hub/go.sum
      # go-daemon is the only private module; the rest resolve from the proxy.
      # Step-level guard: env context is not allowed in job-level if, and a
      # missing secret must SKIP the work, not fail the public mirror.
      - name: Authenticate Go private modules
        if: env.FLAKE_PAT != ''
        run: git config --global url."https://x-access-token:${FLAKE_PAT}@github.com/".insteadOf "https://github.com/"
      - run: GOWORK=off go build ./...
        if: env.FLAKE_PAT != ''
        working-directory: hub
      - run: GOWORK=off go test -race -count=1 ./...
        if: env.FLAKE_PAT != ''
        working-directory: hub

  lint-core:
    name: lint (core)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install golangci-lint v2.15.0 (devShell parity)
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.15.0
      - run: GOWORK=off golangci-lint run ./...

  lint-hub:
    name: lint (hub)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: hub/go.sum
      - name: Authenticate Go private modules
        if: env.FLAKE_PAT != ''
        run: git config --global url."https://x-access-token:${FLAKE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Install golangci-lint v2.15.0 (devShell parity)
        if: env.FLAKE_PAT != ''
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.15.0
      # The one root .golangci.yml serves both modules (v2 has no extends).
      - run: GOWORK=off golangci-lint run -c ../.golangci.yml ./...
        if: env.FLAKE_PAT != ''
        working-directory: hub

  dupl-gate:
    name: art-dupl clone gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install art-dupl v0.9.1-0.20261017225421-93432fd910fb (devShell parity)
        run: go install github.com/LarsArtmann/art-dupl/cmd/art-dupl@v0.9.1-0.20261017225421-93432fd910fb
      # Baseline ratchet: only clones NEW relative to .art-dupl-baseline.json
      # fail; intentional clones carry // art-dupl:accept directives.
      - run: art-dupl -t 1 --type-aware check --baseline-path .art-dupl-baseline.json .

  format:
    name: dprint + actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dprint 0.64.3 (devShell parity)
        run: |
          curl -fsSL https://dprint.dev/install.sh | sh -s 0.64.3
          echo "$HOME/.dprint/bin" >> "$GITHUB_PATH"
      - run: dprint check
      - name: Install actionlint 1.7.12 (devShell parity)
        run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
      # the download script drops the binary in the CWD (repo root)
      - run: ./actionlint

  templ-fmt:
    name: templ fmt gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: hub/go.sum
      # The generator is pinned by the hub tool directive (v0.3.1100): the
      # same binary formats locally and in CI (AGENTS.md templ errata).
      - run: GOWORK=off go tool templ fmt -fail ./internal/dashboard/
        working-directory: hub

  stack-drift:
    name: stack drift check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the stack-selection drift checker
        run: git clone --depth 1 https://github.com/LarsArtmann/SKILLS /tmp/skills
      - run: bash /tmp/skills/stack-selection/scripts/stack-drift-check.sh "$PWD"

  citation-gate:
    name: report citation gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-citations.sh

  cmdguard-lint:
    name: cmdguard usage gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: hub/go.mod
          cache: false
      # The published lint module carries local-dev replace directives, so
      # `go run @version` is unusable (upstream TODO, owner-gated); a shallow
      # clone of the pinned tag satisfies the sibling replaces.
      - name: Fetch cmdguard-lint lint/v0.3.0
        run: git clone --depth 1 --branch lint/v0.3.0 https://github.com/LarsArtmann/cmdguard /tmp/cmdguard
      - run: go -C /tmp/cmdguard/lint run ./cmd/cmdguard-lint lint "$GITHUB_WORKSPACE"

  # Branded-ID gate (BD003): identifier-typed params/returns/fields must use
  # strong ID types or carry a reasoned //brandid-lint:ignore(BD003)
  # directive. Same rules as the local BuildFlow step (tool_options in
  # .buildflow.yml); pinned `go run` needs no credentials. Bump the tag
  # manually when a new linter release lands.
  brandid-lint:
    name: branded-ID gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      # @v0.5.1 (canonical module version of the `linter` module) — the
      # tag form `@linter/v0.5.1` is a disallowed version string for
      # `go run pkg@version` (first real CI execution failed on it).
      - run: go run github.com/larsartmann/go-branded-id/linter/cmd/brandid-lint@v0.5.1 -rules BD003 .

  css-freshness:
    name: dashboard CSS freshness gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: hub/go.sum
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # main
      # Warm the module cache with VISIBLE errors first: gen-library-classes
      # resolves templ-components (and its sub-dirs) via `go list -m` and the
      # first real run (2026-11-19) got a silent empty .Dir on the cold runner,
      # while build+test(hub) downloads the same module fine — downloading the
      # parent pulls the whole source tree (the sub-dirs live inside it) and
      # makes any fetch problem loud instead of an empty .Dir.
      - run: cd hub && GOWORK=off go mod download github.com/larsartmann/templ-components github.com/larsartmann/templ-components/datastar github.com/larsartmann/templ-components/errorpage github.com/larsartmann/templ-components/icons github.com/larsartmann/templ-components/utils
      # Byte-freshness: regenerating from go.mod truth + app.css must
      # reproduce the committed artifacts exactly — an adopted component
      # whose utilities never reached the stylesheet renders unstyled.
      # The tailwind tool is pinned to THIS flake's lockfile (.#tailwindcss):
      # the registry build moved under the same version and re-wrapped the
      # output, red-flagging every run until artifacts were regenerated.
      - run: nix shell .#tailwindcss -c bash scripts/regen-ui.sh
      - run: git diff --exit-code -- hub/internal/dashboard/library-classes.txt hub/internal/dashboard/library-custom.css hub/internal/dashboard/app.min.css

  docs-gates:
    name: docs gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # main
      - run: nix run github:Artmann-Technologies/docs-gates -- run .

  flake-check:
    name: nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # main
        if: env.FLAKE_PAT != ''
        with:
          extra-conf: access-tokens = github.com=${{ env.FLAKE_PAT }}
      - run: nix flake check
        if: env.FLAKE_PAT != ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
